
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3/dist/css/uikit.min.css">
    <script src="https://cdn.jsdelivr.net/npm/uikit@3/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3/dist/js/uikit-icons.min.js"></script>
    <script src="/css/jsexamples/js/popquiz.js" defer></script>
</head>
<body>

    <div class="uk-section uk-section-muted">
        <div class="uk-container uk-container-small">

            <div id="quiz-container" class="uk-card uk-card-default uk-card-body">

                <h3 class="uk-card-title">Animal Quiz</h3>
                <p>Test your knowledge of animals.</p>

                <form id="optionsForm">
                    <fieldset class="uk-fieldset">

                        <legend id="question" class="uk-legend"></legend>

                        <div class="uk-margin">
                            <label>
                                <input class="uk-radio" type="radio" name="option" value="Elephant">
                                Elephant
                            </label>
                        </div>

                        <div class="uk-margin">
                            <label>
                                <input class="uk-radio" type="radio" name="option" value="Lion">
                                Lion
                            </label>
                        </div>

                        <div class="uk-margin">
                            <label>
                                <input class="uk-radio" type="radio" name="option" value="Bat">
                                Bat
                            </label>
                        </div>

                        <div class="uk-margin">
                            <label>
                                <input class="uk-radio" type="radio" name="option" value="Zebra">
                                Zebra
                            </label>
                        </div>

                        <div class="uk-margin">
                            <label>
                                <input class="uk-radio" type="radio" name="option" value="Cheetah">
                                Cheetah
                            </label>
                        </div>

                    </fieldset>
                </form>

                <button id="submit" class="uk-button uk-button-primary">Submit</button>

                <div id="result" class="uk-margin"></div>

            </div>

        </div>
    </div>

</body>
</html>
